name: Daily job feed

on:
  schedule:
    # GitHub sometimes delays or skips scheduled runs, so try three times before Claude's 08:40 IST run.
    - cron: "17 0 * * *"   # 05:47 IST
    - cron: "23 1 * * *"   # 06:53 IST
    - cron: "4 2 * * *"    # 07:34 IST
  workflow_dispatch:        # "Run workflow" button for a manual refresh
    inputs:
      hours_old:
        description: "Look back this many hours (blank = config default, 168 = one week)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: job-feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install python-jobspy==1.4.0 requests

      - name: Scrape LinkedIn, Indeed, Naukri, Google (+ Apify backup)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          HOURS_OLD: ${{ github.event.inputs.hours_old }}
        run: python scrape.py

      - name: Save feed
        run: |
          git config user.name "job-feed-bot"
          git config user.email "job-feed-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Job feed $(TZ=Asia/Kolkata date +%F)"
          git push
